name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check src/ tests/ scripts/ config/ app/
      # In a fresh clone the training outputs (data/processed, models/) are
      # absent, but the committed deployment bundle (artifacts/) is not — so
      # the golden regression runs here, in-process and through HTTP.
      - run: pytest -v -rs
  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      # the verify stage re-runs the hash gate and the test suite in-image
      - run: docker build -t credit-risk:ci .
